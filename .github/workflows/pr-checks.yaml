name: PR Checks

on:
  pull_request:
    branches:
      - master

concurrency:
  group: pr-checks-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: TS check, lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this application repo
        uses: actions/checkout@v4
      - name: Use pnpm (from packageManager field)
        uses: pnpm/action-setup@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: TS check
        shell: bash
        run: pnpm run ts
      - name: Lint
        shell: bash
        run: pnpm run lint
      - name: Test
        shell: bash
        run: pnpm run test:run
